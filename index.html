<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a5a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Máquina de Perfumes</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2a2420;--mut:#7a6f66;--ac:#8a5a44;--ac2:#f1e6dd;--bd:#e4dad0;--ok:#3d7a4f;--er:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#1b1714;--card:#262019;--tx:#efe6dd;--mut:#a89c90;--ac:#d19a7c;--ac2:#35291f;--bd:#3a3026;--ok:#6fbf86;--er:#e08080}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:8px 0 2px}h2{font-size:18px;margin:12px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
label.op{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer;min-height:48px}
label.op:has(input:checked){background:var(--ac2);border-color:var(--ac)}input[type=radio],input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer;min-height:44px}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.45;cursor:default}
select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dica{color:var(--mut);font-size:13px;margin:6px 0}
.abas{display:flex;gap:8px;margin:4px 0 8px}.abas button{flex:1}.abas button.sec{border-color:var(--bd)}
.hist{font-size:14px;color:var(--mut)}.hist button{padding:2px 8px;min-height:0;font-size:12px;margin-left:6px}
.barra{height:10px;border-radius:5px;background:var(--ac2);margin:3px 0 8px;overflow:hidden}.barra i{display:block;height:100%;background:var(--ac)}
.fam{display:flex;justify-content:space-between;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 0;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--ac2);color:var(--ac)}.ruim{color:var(--er)}
.notas button{padding:10px 14px;min-width:44px}.notas button.sel{background:var(--ac);color:#fff}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--ac2);padding:10px;border-radius:8px}
.erro{color:var(--er);margin:8px 0}textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.banner{background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.estrelas{color:var(--ac);letter-spacing:2px}.falta{color:var(--er);font-size:14px;margin:6px 0}
.rodape{margin-top:20px;font-size:13px;color:var(--mut)}
.ajuste-linha{padding:8px 0;border-bottom:1px solid var(--bd)}.ajuste-linha input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0 0}.ajuste-linha.acima .dica,.ajuste-linha.acima output{color:var(--er)}
.ajuste-linha output{font-variant-numeric:tabular-nums;white-space:nowrap}summary{cursor:pointer}
.vidro{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}.vidro .linha{margin:4px 0}.vidro input[type=number],.vidro input[type=search]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
.vidro input[type=number]{width:88px}.vidro input[type=search]{width:100%;margin:6px 0}.achados button{display:block;width:100%;text-align:left;margin:4px 0;background:var(--ac2);color:var(--tx);min-height:40px}
.achados small{color:var(--mut)}.ok{color:var(--ok)}
.cuidados{margin:10px 0}.cuidado{border-left:3px solid var(--bd);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}.cuidado.atencao{border-left-color:var(--ac)}
.cuidado ul{padding-left:18px;margin:6px 0;font-size:12px}.cuidado a{color:var(--ac)}
.alerta{color:var(--er);border-left:3px solid var(--er);padding:2px 0 2px 10px;margin:8px 0;font-size:14px;font-weight:600}.ajuste-linha.alergia .dica{color:var(--er)}
.tecnico{margin:10px 0}.tecnico h3{font-size:14px;margin:14px 0 4px}.tecnico ul{padding-left:18px;margin:4px 0;font-size:13px}.tecnico li{margin:3px 0}.nivel-erro b{color:var(--er)}
table.dosagem{margin:6px 0}table.dosagem th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--bd)}table.dosagem td:first-child{width:64px}
table.dosagem th:last-child,table.dosagem td:last-child{text-align:right}table.dosagem tfoot td{font-weight:600;border-bottom:0}
#folha{display:none}
@media print{
@page{margin:14mm}
body{background:#fff}main{display:none}
#folha{display:block;font:12pt/1.4 system-ui,-apple-system,Segoe UI,sans-serif}#folha,#folha *{color:#000!important;background:#fff!important}
#folha h1{font-size:20pt;margin:0 0 4pt}#folha h2{font-size:13pt;margin:14pt 0 4pt;border-bottom:1pt solid #000}
#folha table{width:100%;border-collapse:collapse;font-size:11pt}#folha th,#folha td{text-align:left;padding:3pt 4pt;border-bottom:.5pt solid #888}
#folha th:last-child,#folha td:last-child{text-align:right}#folha td:first-child{width:auto}#folha tfoot td{font-weight:700}
#folha .selo{display:inline-block;font-weight:700;padding:4pt 8pt;border:1.5pt solid #000;margin:4pt 0}#folha .selo.nao{border-style:dashed}
#folha ul{padding-left:16pt;font-size:11pt}#folha .rodape-folha{margin-top:16pt;font-size:9pt}
}
</style>
</head>
<body><main>
<h1>Máquina de Perfumes</h1>
<p class="sub">Responda algumas perguntas e eu monto o seu perfume. Sem internet, sem IA: tudo é calculado aqui no seu aparelho.</p>
<div id="aviso" class="banner" hidden></div>
<nav class="abas"><button id="aba-novo">Novo perfume</button><button id="aba-receitas" class="sec">Minhas receitas</button><button id="aba-mapa" class="sec">Minha máquina</button></nav>
<div class="linha" id="topo"><label class="dica">Máquina <select id="maq"></select></label><label class="dica"><input type="checkbox" id="tec"> modo técnico</label></div>
<div id="hist" class="hist"></div>
<div id="tela"></div>
<p class="rodape" id="rodape"></p>
</main>
<div id="folha"></div>
<script src="motor.js"></script>
<script src="app.js"></script>
</body></html>
