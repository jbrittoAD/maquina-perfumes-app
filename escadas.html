<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a5a44">
<title>Escadas · Máquina de Perfumes</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2a2420;--mut:#7a6f66;--ac:#8a5a44;--ac2:#f1e6dd;--bd:#e4dad0;--ok:#3d7a4f;--er:#a33}
@media (prefers-color-scheme:dark){:root{--bg:#1b1714;--card:#262019;--tx:#efe6dd;--mut:#a89c90;--ac:#d19a7c;--ac2:#35291f;--bd:#3a3026;--ok:#6fbf86;--er:#e08080}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:8px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
input,select,button,textarea{font:inherit;color:var(--tx)}input[type=number],input[type=text],select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
button{border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer;min-height:44px}button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}button:disabled{opacity:.45;cursor:default}
.abas{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}.abas button{flex:1;min-width:0}.abas button.sec{border-color:var(--bd)}
@media (max-width:480px){.abas button{flex:1 1 calc(50% - 4px)}}
.dica{color:var(--mut);font-size:13px;margin:6px 0}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.barra .grow{flex:1}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut);min-width:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.escada{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.escada h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px}.escada h2 span{color:var(--mut);font-weight:400;font-size:13px;flex:1}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd);padding:3px 4px}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td{padding:3px 4px;border-bottom:1px solid var(--bd)}
input[type=number]{width:88px;text-align:right}
.vazio{padding:20px;text-align:center;color:var(--mut);font-size:14px}
#folha{display:none}
@media (max-width:560px){.campos{grid-template-columns:1fr}th{padding:3px 2px}td{padding:3px 2px}.escada th.num,.escada td.num{white-space:normal}}
@media print{
@page{margin:12mm}
body{background:#fff}main{display:none}
#folha{display:block;font:11pt/1.35 system-ui,-apple-system,Segoe UI,sans-serif}#folha,#folha *{color:#000!important;background:#fff!important}
#folha .cab{font-size:9pt;margin-bottom:6pt}
#folha .bloco{break-inside:avoid;page-break-inside:avoid;border:1pt solid #000;padding:7pt 9pt;margin:0 0 9pt}
#folha h2{font-size:12pt;margin:0 0 4pt}#folha table{font-size:10.5pt;break-inside:avoid;page-break-inside:avoid}#folha th,#folha td{border-bottom:.5pt solid #888;padding:2pt 3pt}
#folha tfoot td{font-weight:700;border-bottom:0}#folha .nota{font-size:9pt;margin-top:4pt}
}
</style>
</head>
<body>
<main>
<h1>Máquina de Perfumes</h1>
<p class="sub">Escadas de gotas: dois materiais, nove frascos — 9+1 até 1+9 —, sempre 10 gotas por frasco. Cheire e anote onde o cheiro vira.</p>
<nav class="abas" aria-label="Navegação">
 <button class="app-nav" data-aba="novo">Novo perfume</button>
 <button class="app-nav sec" data-aba="receitas">Minhas receitas</button>
 <button class="app-nav sec" data-aba="mapa">Minha máquina</button>
 <button class="sec" id="nav-acordes">Acordes</button>
 <button class="sec" id="nav-escadas" aria-current="page">Escadas</button>
</nav>
<div class="barra">
 <span class="dica">Cada frasco: as gotas do material A + as do B. A tabela mostra as gramas pela gota escolhida.</span>
 <span class="grow"></span>
 <button id="imprimir-escadas" disabled>Imprimir escadas</button>
 <button id="add-escada" class="sec">Adicionar escada</button>
</div>
<div id="lista-escadas"></div>
</main>
<div id="folha"></div>
<script>
window.DADOS = {"materiais":[{"cas":"100-52-7","nome":"Benzaldeído","curto":"Benzaldeído"},{"cas":"10094-34-5","nome":"Butirato de Dimetil Benzil Carbinol","curto":"Butirato de Dimetil Benzil Carbinol"},{"cas":"101-86-0","nome":"Aldeído Hexil Cinâmico (JASMONAL)","curto":"Aldeído Hexil Cinâmico"},{"cas":"103-54-8","nome":"Cinnamyl Acetate","curto":"Cinnamyl Acetate"},{"cas":"104-55-2","nome":"Aldeído Cinâmico (Cinamaldeído)","curto":"Aldeído Cinâmico"},{"cas":"104-67-6","nome":"Aldeído C14","curto":"Aldeído C14"},{"cas":"10461-98-0","nome":"Peonile (nitrilo gerânio)","curto":"Peonile"},{"cas":"105-95-3","nome":"Etileno Brassilato","curto":"Etileno Brassilato"},{"cas":"106-22-9","nome":"Citronelol","curto":"Citronelol"},{"cas":"106-23-0","nome":"Citronelal","curto":"Citronelal"},{"cas":"106-24-1","nome":"geraniol","curto":"geraniol"},{"cas":"107-75-5","nome":"Hidroxicitronelal","curto":"Hidroxicitronelal"},{"cas":"110-41-8","nome":"Aldeído C12 MNA","curto":"Aldeído C12 MNA"},{"cas":"112-31-2","nome":"Aldeído C-10 (Decanal)","curto":"Aldeído C-10"},{"cas":"112-44-7","nome":"Aldeído C11 Undecílico","curto":"Aldeído C11 Undecílico"},{"cas":"112-54-9","nome":"Aldeído C-12 Láurico (Dodecanal)","curto":"Aldeído C-12 Láurico"},{"cas":"115-95-7","nome":"Acetato de Linalila","curto":"Acetato de Linalila"},{"cas":"118-58-1","nome":"Salicilato de Benzila","curto":"Salicilato de Benzila"},{"cas":"120-72-9","nome":"Indol","curto":"Indol"},{"cas":"1205-17-0","nome":"Helional","curto":"Helional"},{"cas":"121-32-4","nome":"Etil Vanilina","curto":"Etil Vanilina"},{"cas":"121-33-5","nome":"Vanilina","curto":"Vanilina"},{"cas":"1222-05-5","nome":"Galaxolide","curto":"Galaxolide"},{"cas":"123-11-5","nome":"Aldeído Anísico","curto":"Aldeído Anísico"},{"cas":"123-68-2","nome":"Allyl Caproate","curto":"Allyl Caproate"},{"cas":"1335-46-2","nome":"N Metil Ionona (iralia total, isoraldeina 70)","curto":"N Metil Ionona"},{"cas":"134-20-3","nome":"Antranilato de metila","curto":"Antranilato de metila"},{"cas":"140-11-4","nome":"Acetato de Benzila","curto":"Acetato de Benzila"},{"cas":"142-19-8","nome":"Alil Heptanoato (allyl heptanoate)","curto":"Alil Heptanoato"},{"cas":"14901-07-6","nome":"Ionona Beta","curto":"Ionona Beta"},{"cas":"150-84-5","nome":"Acetato de citronelila","curto":"Acetato de citronelila"},{"cas":"1506-02-1","nome":"Tonalide ()","curto":"Tonalide"},{"cas":"151-05-3","nome":"Acetato de Dimetil Benzil Carbineol (DMBCA)","curto":"Acetato de Dimetil Benzil Carbineol"},{"cas":"17283-81-7","nome":"Dihidro Beta Ionona (ionona amadeirada)","curto":"Dihidro Beta Ionona"},{"cas":"18479-58-8","nome":"Dihidromircenol","curto":"Dihidromircenol"},{"cas":"24851-98-7","nome":"Hedione","curto":"Hedione"},{"cas":"28219-61-6","nome":"Bacdanol","curto":"Bacdanol"},{"cas":"32388-55-9","nome":"Cedramber (METIL CEDRIL ÉTER)","curto":"Cedramber"},{"cas":"33704-61-9","nome":"Cashmeran","curto":"Cashmeran"},{"cas":"37677-14-8","nome":"Aldeído Myrac (empetal)","curto":"Aldeído Myrac"},{"cas":"470-82-6","nome":"Eucaliptol (1,8-Cineol)","curto":"Eucaliptol"},{"cas":"4940-11-8","nome":"Etil Maltol","curto":"Etil Maltol"},{"cas":"54464-57-2","nome":"Iso E Super","curto":"Iso E Super"},{"cas":"5471-51-2","nome":"Raspberry Ketone (Frambinone)","curto":"Raspberry Ketone"},{"cas":"58567-11-6","nome":"Boisambrene Forte®","curto":"Boisambrene Forte®"},{"cas":"60-12-8","nome":"Álcool Feniletílico","curto":"Álcool Feniletílico"},{"cas":"6259-76-3","nome":"Salicilato de Hexila (rodiaflor SnH)","curto":"Salicilato de Hexila"},{"cas":"6790-58-5","nome":"Ambroxan","curto":"Ambroxan"},{"cas":"68647-72-3","nome":"Terpenos de Laranja","curto":"Terpenos de Laranja"},{"cas":"68901-15-5","nome":"Ciclogalbanato (glicoflor)","curto":"Ciclogalbanato"},{"cas":"78-70-6","nome":"linalool","curto":"linalool"},{"cas":"8000-25-7","nome":"Óleo Essencial de Alecrim","curto":"Óleo Essencial de Alecrim"},{"cas":"81782-77-6","nome":"Undecavertol (violet decenol)","curto":"Undecavertol"},{"cas":"88-41-5","nome":"Verdox","curto":"Verdox"},{"cas":"90-17-5","nome":"Acetato Rosa (cristais de rosa)","curto":"Acetato Rosa"},{"cas":"91-64-5","nome":"Cumarina","curto":"Cumarina"},{"cas":"93-58-3","nome":"Benzoato de Metila","curto":"Benzoato de Metila"},{"cas":"93-92-5","nome":"Acetato de Estiralila","curto":"Acetato de Estiralila"},{"cas":"97-53-0","nome":"Eugenol","curto":"Eugenol"},{"cas":"98-52-2","nome":"Patchone (patchouli hexanol)","curto":"Patchone"}]};
</script>
<script>
(() => {
  'use strict';
  const D = window.DADOS, $ = s => document.querySelector(s);
  const CHAVE_ESC = 'catalogo.escadas.v1', MAX_ESCADAS = 5, GOTA_PADRAO = 0.03, RAZOES = [9, 8, 7, 6, 5, 4, 3, 2, 1];
  const fmt = (n, c = 2) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: c });
  const g3 = n => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const el = (t, a = {}, ...f) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k.startsWith('aria-')) e.setAttribute(k, v); else e[k] = v; } f.flat().forEach(x => e.append(x)); return e; };
  const matsPorNome = D.materiais.map((m, i) => [i, m]).sort((a, b) => a[1].nome.localeCompare(b[1].nome, 'pt-BR'));
  const nome = i => i === null || i === undefined || !D.materiais[i] ? '' : D.materiais[i].nome;

  let escadas;
  try { escadas = JSON.parse(localStorage.getItem(CHAVE_ESC) || 'null') || []; } catch { escadas = []; }
  if (!escadas.length) escadas = [novaEscada()];
  function novaEscada() { return { a: null, b: null, gota: GOTA_PADRAO, nota: '' }; }
  function gravar() { try { localStorage.setItem(CHAVE_ESC, JSON.stringify(escadas)); } catch { /* sem armazenamento: vale só nesta aba */ } }

  function selectDe(esc, campo, rotulo, n) {
    const sel = el('select', { 'aria-label': rotulo, onchange: () => { esc[campo] = sel.value === '' ? null : +sel.value; gravar(); desenhar(); } },
      el('option', { value: '' }, '— escolher —'),
      ...matsPorNome.map(([i, m]) => el('option', { value: i, selected: esc[campo] === i }, m.nome)));
    return sel;
  }

  function blocoEscada(esc, n) {
    const completa = esc.a !== null && esc.b !== null;
    const card = el('div', { class: 'escada' },
      el('h2', {}, 'Escada ' + n, el('span', {}, completa ? nome(esc.a) + ' × ' + nome(esc.b) : 'incompleta'),
        el('button', { class: 'sec', style: 'min-height:36px;padding:4px 12px', onclick: () => { escadas.splice(n - 1, 1); if (!escadas.length) escadas.push(novaEscada()); gravar(); desenhar(); } }, 'Remover')),
      el('div', { class: 'campos' },
        el('label', { class: 'f' }, 'Material A', selectDe(esc, 'a', 'Material A da escada ' + n, n)),
        el('label', { class: 'f' }, 'Material B', selectDe(esc, 'b', 'Material B da escada ' + n, n)),
        el('label', { class: 'f' }, 'Gramas por gota (g)',
          (() => { const campo = el('input', { type: 'number', min: 0.001, step: 0.001, value: esc.gota, 'aria-label': 'Gramas por gota da escada ' + n, onchange: () => { esc.gota = Math.max(0.001, Number(campo.value) || GOTA_PADRAO); gravar(); desenhar(); } }); return campo; })()),
        el('label', { class: 'f' }, 'Anotação (para quê)',
          (() => { const campo = el('input', { type: 'text', value: esc.nota, placeholder: 'ex.: achar onde a rosa vira cravo', 'aria-label': 'Anotação da escada ' + n, onchange: () => { esc.nota = campo.value; gravar(); } }); return campo; })())),
      completa
        ? el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Frasco'), el('th', { class: 'num' }, 'Gotas de ' + nome(esc.a)), el('th', { class: 'num' }, nome(esc.b)), el('th', { class: 'num' }, 'Total (g)'))),
          el('tbody', {}, ...RAZOES.map((r, i) => el('tr', {}, el('td', {}, String(i + 1)), el('td', { class: 'num' }, r + ' (' + g3(r * esc.gota) + ' g)'), el('td', { class: 'num' }, (10 - r) + ' (' + g3((10 - r) * esc.gota) + ' g)'), el('td', { class: 'num' }, g3(10 * esc.gota))))),
          el('tfoot', {}, el('tr', {}, el('td', {}, 'Total'), el('td', { class: 'num' }, '45 (' + g3(45 * esc.gota) + ' g)'), el('td', { class: 'num' }, '45 (' + g3(45 * esc.gota) + ' g)'), el('td', { class: 'num' }, g3(90 * esc.gota)))))
        : el('div', { class: 'vazio' }, 'Escolha os dois materiais'));
    return card;
  }

  function desenhar() {
    $('#lista-escadas').replaceChildren(...escadas.map((e, i) => blocoEscada(e, i + 1)));
    $('#add-escada').disabled = escadas.length >= MAX_ESCADAS;
    $('#add-escada').textContent = escadas.length >= MAX_ESCADAS ? 'Limite de ' + MAX_ESCADAS + ' escadas' : 'Adicionar escada';
    $('#imprimir-escadas').disabled = !escadas.some(e => e.a !== null && e.b !== null);
  }

  function imprimirEscadas() {
    const prontas = escadas.filter(e => e.a !== null && e.b !== null);
    $('#folha').replaceChildren(
      el('div', { class: 'cab' }, 'Escadas de gotas · ' + prontas.length + ' · 10 gotas por frasco · ' + new Date().toLocaleDateString('pt-BR')),
      ...prontas.map((e, n) => el('div', { class: 'bloco' },
        el('h2', {}, 'Escada ' + (n + 1) + ': ' + nome(e.a) + ' × ' + nome(e.b) + (e.nota ? ' — ' + e.nota : '')),
        el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Frasco'), el('th', { class: 'num' }, 'Gotas de ' + nome(e.a)), el('th', { class: 'num' }, 'Gotas de ' + nome(e.b)), el('th', { class: 'num' }, 'Peso (g)'))),
          el('tbody', {}, ...RAZOES.map((r, i) => el('tr', {}, el('td', {}, String(i + 1)), el('td', { class: 'num' }, String(r)), el('td', { class: 'num' }, String(10 - r)), el('td', { class: 'num' }, g3(10 * e.gota))))),
          el('tfoot', {}, el('tr', {}, el('td', {}, 'Total'), el('td', { class: 'num' }, '45'), el('td', { class: 'num' }, '45'), el('td', { class: 'num' }, g3(90 * e.gota))))),
        el('div', { class: 'nota' }, 'Gota de ' + g3(e.gota) + ' g. Onde o cheiro vira: frasco ____   Nota (1-5): ____   Anotações: ______________________________'))));
    window.print();
  }

  $('#add-escada').onclick = () => { if (escadas.length < MAX_ESCADAS) { escadas.push(novaEscada()); gravar(); desenhar(); } };
  $('#imprimir-escadas').onclick = imprimirEscadas;
  document.querySelectorAll('.app-nav').forEach(b => { if (location.protocol === 'file:') b.hidden = true; else b.onclick = () => { location.href = 'index.html?aba=' + b.dataset.aba; }; });
  $('#nav-acordes').onclick = () => { location.href = location.protocol === 'file:' ? 'catalogo-de-acordes.html' : 'catalogo.html'; };
  desenhar();
})();
</script>
</body>
</html>
